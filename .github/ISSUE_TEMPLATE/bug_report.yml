name: Bug Report
description: Create a report to help us fix a bug or unexpected behavior
title: '[Bug]: '
labels: ['bug', 'good first issue']
assignees: ''

body:
  - type: markdown
    attributes:
      value: Thank you for taking the time to report an issue in AI Model Router!
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe what happened...
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Affected Component / File Path
      description: E.g., backend/app/router/scoring.py or frontend/src/pages/Dashboard.tsx
      placeholder: file/path.py
    validations:
      required: false
  - type: textarea
    id: steps
    attributes:
      label: Steps To Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Run CLI '...'
        2. Send HTTP request to '...'
        3. See error...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Linux
        - macOS
        - Windows
        - Docker
    validations:
      required: true
