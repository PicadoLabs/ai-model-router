[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "model-router-cli"
version = "1.0.0"
description = "Intelligent, explainable LLM request routing platform & AI Traffic Control Room"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "PicadoLabs", email = "picadolabs@gmail.com" }
]
maintainers = [
    { name = "Kaap10", email = "picadolabs@gmail.com" }
]
license = { text = "MIT" }
keywords = ["llm", "ai", "router", "fastapi", "ollama", "openai", "cost-optimization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "sse-starlette>=2.0.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.1",
    "tiktoken>=0.6.0"
]

[project.urls]
Homepage = "https://picadolabs.me"
Repository = "https://github.com/PicadoLabs/ai-model-router"
Issues = "https://github.com/PicadoLabs/ai-model-router/issues"

[project.scripts]
modelrouter = "app.cli.main:app"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.package-data]
"app" = ["static/**/*", "static/*"]
